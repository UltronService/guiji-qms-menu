<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#474e25">
    <title>龜記叫號看板（客戶預覽）</title>
    <link rel="icon" href="../../favicon.ico" sizes="48x48">
    <link rel="stylesheet" href="../css/style.css">
    <script>
    function showNoImage(img) {
        if (!img) return;
        img.style.display = 'none';
        var parent = img.parentNode;
        if (!parent || parent.querySelector('.no-image-text')) return;
        var div = document.createElement('div');
        div.className = 'no-image-text';
        div.textContent = '請確認 v-ip/assets 菜單裁切圖檔';
        parent.appendChild(div);
    }
    </script>
</head>
<body class="client-preview">

<div id="viewport-container">
    <div id="qms-banner" class="standby-mode">
        <div class="logo-area" id="banner-logo">
            <img src="../../assets/logo2.svg" alt="龜記 Guiji 品牌標誌">
        </div>

        <div class="main-number-area">
            <div id="main-number"></div>
        </div>

        <div class="character-area" id="character-area">
            <img id="character-img" class="character-img" src="" alt="龜記 IP 角色">
        </div>

        <div class="history-area mode-grid-b" id="history-area"></div>

        <button type="button" id="client-clear-history" aria-label="清空歷史並重新播放">↺ 清空歷史</button>
    </div>

    <div id="menu-area">
        <div class="menu-drinks">
            <img src="../assets/menu-drinks-1080.jpg" alt="飲品菜單" width="1080" height="1366" onerror="showNoImage(this)">
        </div>
        <div class="menu-footer" id="menu-footer" aria-live="polite">
            <div class="menu-footer-track" id="menu-footer-track">
                <img class="menu-footer-band menu-footer-band--band1" src="../assets/menu-footer-band-1.jpg" alt="客製調整與加料" width="1080" height="193">
                <div class="menu-footer-gap" aria-hidden="true"></div>
                <img class="menu-footer-band menu-footer-band--band2" src="../assets/menu-footer-band-2.jpg" alt="糖度、冰量、圖例與 QR" width="1080" height="208">
            </div>
        </div>
    </div>
</div>

<script src="../js/menu-board.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/ui.js"></script>
<script src="js/client-app.js"></script>
</body>
</html>
