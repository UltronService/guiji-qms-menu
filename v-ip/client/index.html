<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#474e25">
    <title>龜記叫號看板（客戶預覽）</title>
    <link rel="icon" href="../../favicon.ico" sizes="48x48">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #client-clear-history {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 9999;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 700;
            color: #474e25;
            background: rgba(219, 238, 15, 0.92);
            border: 2px solid #474e25;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        #client-clear-history:active {
            transform: scale(0.97);
        }
    </style>
    <script>
    function showNoImage(img) {
        if (!img) return;
        img.style.display = 'none';
        var parent = img.parentNode;
        if (!parent || parent.querySelector('.no-image-text')) return;
        var div = document.createElement('div');
        div.className = 'no-image-text';
        div.textContent = '請確認 assets/menu.jpg 檔案';
        parent.appendChild(div);
    }
    </script>
</head>
<body>

<div id="viewport-container">
    <div id="qms-banner" class="standby-mode">
        <div class="logo-area" id="banner-logo">
            <img src="../../assets/logo2.svg" alt="龜記 Guiji 品牌標誌">
        </div>

        <div class="main-number-area">
            <div id="main-number"></div>
        </div>

        <div class="character-area" id="character-area">
            <img id="character-img" class="character-img" src="" alt="龜記 IP 角色">
        </div>

        <div class="history-area mode-grid-b" id="history-area"></div>
    </div>

    <div id="menu-area">
        <img src="../../assets/menu.jpg" alt="電子菜單" onerror="showNoImage(this)">
    </div>
</div>

<button type="button" id="client-clear-history" aria-label="清空歷史並重新播放">↺ 清空歷史</button>

<script src="../js/audio.js"></script>
<script src="../js/ui.js"></script>
<script src="js/client-app.js"></script>
</body>
</html>
